name: Temporary Windows CRLF Hotfix Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-crlf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convert Tistory worker to CRLF
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/tistory/workflows/tistory-draft-worker.mjs")
          text = path.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")
          path.write_bytes(text.replace("\n", "\r\n").encode("utf-8"))

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

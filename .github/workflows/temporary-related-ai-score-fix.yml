              '{canGenerate ? <details className="mt-4 rounded-xl border bg-white/80 p-4">\n      <summary className="cursor-pointer text-sm font-semibold">{isHero ? "AI 대표이미지 생성 설정" : "AI 이미지로 교체 설정 · 유료"}</summary>')
          replace_once(path,
              '      <p className="mt-3 text-xs leading-5 text-[#77777f]">AI 생성은 OpenAI API 비용이 발생할 수 있으며 대표이미지에만 허용됩니다. 자동 생성은 콘텐츠당 최대 한 장입니다.</p>',
              '      <p className="mt-3 text-xs leading-5 text-[#77777f]">{isHero ? "AI 대표이미지는 OpenAI API 비용이 발생하며 자동 생성은 콘텐츠당 최대 한 장입니다." : "무료 카드의 AI 교체는 사용자가 이 버튼을 직접 눌렀을 때만 실행되며 OpenAI 이미지 API 비용이 발생합니다."}</p>')
          replace_once(path,
              '{isHero ? <button className="rounded-xl bg-[#ff6b6b] px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50" disabled={busy || !prompt.trim()} onClick={() => void generate()} type="button">{working === "generate" ? "AI 생성 중…" : "대표이미지 AI 생성"}</button> : null}',
              '{canGenerate ? <button className="rounded-xl bg-[#ff6b6b] px-4 py-2.5 text-sm font-semibold text-white disabled:opacity-50" disabled={busy || !prompt.trim()} onClick={() => void generate()} type="button">{working === "generate" ? "AI 생성 중…" : isHero ? "대표이미지 AI 생성" : "AI 이미지로 교체 · 유료"}</button> : null}')
          replace_once(path,
              'function defaultPrompt(block: ImageBlock): string {',
              '''function initialPrompt(block: ImageBlock): string {
  const current = block.prompt?.trim() ?? "";
  if (!current || /^Bright 무료 .+ 컴포넌트$/.test(current)) return defaultPrompt(block);
  return current;
}

function defaultPrompt(block: ImageBlock): string {''')

          # Server: automatic generation remains hero-only; explicit manual generation is allowed for Bright cards only.
          path = "app/api/media/route.ts"
          replace_once(path,
              '''  if (isBrightComponentPurpose(owner.block.purpose)) {
    throw new Error("비교·체크리스트·요약·경고 콘텐츠는 AI 이미지 대신 Bright HTML/SVG 컴포넌트를 사용합니다.");
  }
  if (owner.block.purpose !== "hero") {
    throw new Error("본문 이미지는 비용 없는 Project 이미지 재사용 또는 파일 업로드를 사용합니다. AI 생성은 대표이미지에만 허용됩니다.");
  }

  if (mode === "automatic") {''',
              '''  const manualBrightReplacement = mode === "manual" && isBrightComponentPurpose(owner.block.purpose);
  if (mode === "automatic" && owner.block.purpose !== "hero") {
    throw new Error("자동 AI 이미지는 원고의 대표이미지 한 개에만 허용됩니다.");
  }
  if (owner.block.purpose !== "hero" && !manualBrightReplacement) {
    throw new Error("일반 본문 이미지는 비용 없는 Project 이미지 재사용 또는 파일 업로드를 사용합니다. 무료 Bright 카드는 사용자가 명시적으로 요청한 수동 AI 교체만 허용됩니다.");
  }

  if (mode === "automatic") {''')

          # Canonical tables must contribute their actual information to search-intent analysis.
          path = "core/content/ContentOpportunityAlignment.ts"
          replace_once(path,
              'import { normalizeStructuredText, structuredListItems, structuredTableCount } from "./StructuredText";',
              'import { normalizeStructuredText, serializeStructuredTable, structuredListItems, structuredTableCount } from "./StructuredText";')
          replace_once(path,
              '  const body = document.blocks.filter((block) => block.type === "paragraph").map((block) => normalizeStructuredText(block.text)).join(" ");',
              '  const body = document.blocks.flatMap((block) => block.type === "paragraph" ? [normalizeStructuredText(block.text)] : block.type === "table" ? [normalizeStructuredText(serializeStructuredTable(block))] : []).join(" ");')
          replace_once(path,
              '  const fullText = normalizeStructuredText(document.blocks.flatMap((block) => block.type === "heading" || block.type === "paragraph" ? [block.text] : []).join("\\n"));',
              '  const fullText = normalizeStructuredText(document.blocks.flatMap((block) => block.type === "heading" || block.type === "paragraph" ? [block.text] : block.type === "table" ? [serializeStructuredTable(block)] : []).join("\\n"));')
          replace_once(path,
              '''    } else if (block.type === "paragraph") {
      texts.push(block.text);
    }''',
              '''    } else if (block.type === "paragraph") {
      texts.push(block.text);
    } else if (block.type === "table") {
      texts.push(serializeStructuredTable(block));
    }''')

          # One unique hero plus canonical zero-cost visuals must not be penalized for avoiding extra paid images.
          path = "core/quality/QualityEngine.ts"
          replace_once(path,
              'import { analyzeImagePrompts, type ImagePromptIssue } from "../media";',
              'import { analyzeImagePrompts, isBrightComponentPurpose, type ImagePromptIssue } from "../media";')
          replace_once(path,
              '''  const imageStrategyComplete = s.images.length > 0 && s.images.every((item) => item.alt.trim().length >= 4);
  const actionableImageIssues = s.imagePromptAnalysis.issues.filter((item) => item.code !== "missing_prompt");
  const imagePromptPenalty = actionableImageIssues.reduce((sum, item) => sum + imageIssuePenalty(item), 0);
  const imageStrategyBaseScore = !s.document.blocks.length ? 0 : imageStrategyComplete ? 94 : s.images.length ? 58 : 72;
  const repeatedImageRolePenalty = s.images.length >= 4 && new Set(s.images.map((item) => item.purpose ?? "inline")).size <= 2 ? 15 : 0;
  const imagePurposeBonus = s.images.length >= 2 && new Set(s.images.map((item) => `${item.purpose ?? "inline"}:${item.alt.trim().slice(0, 24)}`)).size === s.images.length ? 6 : 0;
  const imageStrategyScore = clamp(imageStrategyBaseScore + imagePurposeBonus - imagePromptPenalty - repeatedImageRolePenalty);''',
              '''  const imageStrategyComplete = s.images.length > 0 && s.images.every((item) => item.alt.trim().length >= 4);
  const actionableImageIssues = s.imagePromptAnalysis.issues.filter((item) => item.code !== "missing_prompt");
  const imagePromptPenalty = actionableImageIssues.reduce((sum, item) => sum + imageIssuePenalty(item), 0);
  const imageStrategyBaseScore = !s.document.blocks.length ? 0 : imageStrategyComplete ? 94 : s.images.length ? 58 : 72;
  const repeatedImageRolePenalty = s.images.length >= 4 && new Set(s.images.map((item) => item.purpose ?? "inline")).size <= 2 ? 15 : 0;
  const zeroCostVisualSignals = s.images.filter((item) => isBrightComponentPurpose(item.purpose)).length
    + s.contentDiagnostic.sections.reduce((sum, section) => sum + section.tableCount, 0);
  const distinctImageRoles = s.images.length >= 2
    && new Set(s.images.map((item) => `${item.purpose ?? "inline"}:${item.alt.trim().slice(0, 24)}`)).size === s.images.length;
  const imagePurposeBonus = imageStrategyComplete && (zeroCostVisualSignals > 0 || distinctImageRoles) ? 6 : 0;
  const imageStrategyScore = clamp(imageStrategyBaseScore + imagePurposeBonus - imagePromptPenalty - repeatedImageRolePenalty);''')
          replace_once(path,
              '        { signal: "repeatedImageRolePenalty", value: repeatedImageRolePenalty },',
              '        { signal: "repeatedImageRolePenalty", value: repeatedImageRolePenalty },\n        { signal: "zeroCostVisualSignals", value: zeroCostVisualSignals },')


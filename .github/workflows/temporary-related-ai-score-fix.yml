          npm run build 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          echo "Verification results: tests=$test_status build=$build_status"
          if [[ "$test_status" != "0" || "$build_status" != "0" ]]; then
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: related-ai-score-fix-logs
          path: |
            test.log
            build.log
          if-no-files-found: warn
          retention-days: 1

name: Temporary Related AI Score Fix

on:
  push:
    branches:
      - fix/canonical-table-and-image-cost-policy

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-table-and-image-cost-policy

      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_value: str, old: str, new: str):
              path = Path(path_value)
              text = path.read_text(encoding="utf-8-sig")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected target missing in {path_value}: {old[:120]}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Related posts must remain the final three blocks, even when free cards are derived later.
          path = "core/media/BrightBodyVisuals.ts"
          replace_once(path,
              "export function ensureFreeBodyVisuals(document: ContentDocument): ContentDocument {\n  const existingBodyVisuals = document.blocks.filter(",
              "export function ensureFreeBodyVisuals(document: ContentDocument): ContentDocument {\n  const orderedDocument = relatedPostsLast(document);\n  const existingBodyVisuals = orderedDocument.blocks.filter(")
          for old, new in [
              ("  if (!remaining) return document;", "  if (!remaining) return orderedDocument;"),
              ("  const sections = collectSections(document);", "  const sections = collectSections(orderedDocument);"),
              ("  if (sections.length < 3) return document;", "  if (sections.length < 3) return orderedDocument;"),
              ("  const existingIds = new Set(document.blocks.map((block) => block.id));", "  const existingIds = new Set(orderedDocument.blocks.map((block) => block.id));"),
              ("  if (!selected.length) return document;", "  if (!selected.length) return orderedDocument;"),
              ("    const baseId = `${document.id}-bright-visual-${section.heading.id}`;", "    const baseId = `${orderedDocument.id}-bright-visual-${section.heading.id}`;"),
              ("  if (!insertions.size) return document;", "  if (!insertions.size) return orderedDocument;"),
              ("  const blocks = document.blocks.flatMap((block, index) => [block, ...(insertions.get(index) ?? [])]);", "  const blocks = orderedDocument.blocks.flatMap((block, index) => [block, ...(insertions.get(index) ?? [])]);"),
              ("    ...document,\n    blocks: Object.freeze(blocks),", "    ...orderedDocument,\n    blocks: Object.freeze(blocks),"),
          ]:
              replace_once(path, old, new)
          replace_once(path,
              "function uniqueId(base: string, existing: ReadonlySet<string>): string {",
              '''function relatedPostsLast(document: ContentDocument): ContentDocument {
  const related = document.blocks.filter(
    (block) => block.type === "button" && block.purpose === "related_post",
  );
  if (!related.length) return document;
  const trailing = document.blocks.slice(-related.length);
  if (trailing.every((block) => block.type === "button" && block.purpose === "related_post")) return document;
  const body = document.blocks.filter(
    (block) => !(block.type === "button" && block.purpose === "related_post"),
  );
  return Object.freeze({ ...document, blocks: Object.freeze([...body, ...related]) });
}

function uniqueId(base: string, existing: ReadonlySet<string>): string {''')

          # Free cards stay zero-cost by default, but the user can explicitly request a paid AI replacement.
          path = "app/user-flow/ImageBlockEditor.tsx"
          replace_once(path,
              'import type { ImageGenerationQuality, ImageGenerationSize, MediaAsset, ProjectMediaAsset } from "../../core/media";',
              'import { isBrightComponentPurpose } from "../../core/media";\nimport type { ImageGenerationQuality, ImageGenerationSize, MediaAsset, ProjectMediaAsset } from "../../core/media";')
          replace_once(path,
              '  const [prompt, setPrompt] = useState(block.prompt ?? defaultPrompt(block));',
              '  const [prompt, setPrompt] = useState(initialPrompt(block));')
          replace_once(path,
              '  const isHero = purpose === "hero";',
              '  const isHero = purpose === "hero";\n  const isFreeCard = isBrightComponentPurpose(purpose);\n  const canGenerate = isHero || isFreeCard;')
          replace_once(path,
              '''    if (!isHero) {
      setNotice("AI 생성은 글마다 고유해야 하는 대표이미지에만 사용할 수 있습니다. 본문 이미지는 Project 재사용 또는 파일 업로드를 이용해 주세요.");
      return;
    }''',
              '''    if (!canGenerate) {
      setNotice("일반 본문 이미지는 Project 재사용 또는 파일 업로드를 이용해 주세요. 무료 Bright 카드는 사용자가 명시적으로 선택한 경우에만 AI 이미지로 교체할 수 있습니다.");
      return;
    }''')
          replace_once(path,
              '    setNotice("AI가 고유 대표이미지를 생성하고 있습니다. 생성이 끝날 때까지 이 화면을 유지해 주세요.");',
              '    setNotice(isHero ? "AI가 고유 대표이미지를 생성하고 있습니다. 생성이 끝날 때까지 이 화면을 유지해 주세요." : "AI가 무료 카드를 대체할 본문 이미지를 생성하고 있습니다. 이 작업은 이미지 API 비용이 발생합니다.");')
          replace_once(path,
              '      if (!response.ok || !result.asset) throw new Error(result.error ?? "AI 대표이미지를 생성하지 못했습니다.");',
              '      if (!response.ok || !result.asset) throw new Error(result.error ?? (isHero ? "AI 대표이미지를 생성하지 못했습니다." : "AI 본문 이미지를 생성하지 못했습니다."));')
          replace_once(path,
              '      setNotice(`AI 대표이미지 생성 완료${result.generation ? ` · ${result.generation.model} · ${result.generation.size}` : ""}`);',
              '      setNotice(`${isHero ? "AI 대표이미지" : "AI 본문 이미지"} 생성 완료${result.generation ? ` · ${result.generation.model} · ${result.generation.size}` : ""}`);')
          replace_once(path,
              '        <strong className="mt-1 block">{block.source ? "이미지 연결 완료" : isHero ? "고유 대표이미지 · 제작 필요" : "본문 이미지 · 무료 방식"}</strong>',
              '        <strong className="mt-1 block">{block.source ? "이미지 연결 완료" : isHero ? "고유 대표이미지 · 제작 필요" : isFreeCard ? "무료 카드 · 필요할 때 AI 이미지로 교체" : "본문 이미지 · 무료 방식"}</strong>')
          replace_once(path,
              '''        <p className="mt-1 text-sm text-[#66666f]">{isHero
          ? "대표이미지는 다른 포스팅과 중복되지 않도록 새로 생성하거나 직접 업로드합니다."
          : "본문 이미지는 비용 없는 Project 이미지 재사용 또는 파일 업로드를 사용합니다."}</p>''',
              '''        <p className="mt-1 text-sm text-[#66666f]">{isHero
          ? "대표이미지는 다른 포스팅과 중복되지 않도록 새로 생성하거나 직접 업로드합니다."
          : isFreeCard
            ? "무료 카드를 그대로 사용하거나 Project 이미지·파일로 교체할 수 있으며, AI 생성은 버튼을 직접 눌렀을 때만 실행됩니다."
            : "본문 이미지는 비용 없는 Project 이미지 재사용 또는 파일 업로드를 사용합니다."}</p>''')
          replace_once(path,

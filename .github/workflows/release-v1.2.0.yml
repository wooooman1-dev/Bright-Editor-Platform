name: Bright Studio v1.2.0 Release

# One-time release workflow. It deletes itself after publishing v1.2.0.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'release: v1.2.0')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: v1.2.0
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Finalize version and remove one-time workflow
        shell: bash
        run: |
          npm version 1.2.0 --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.2.0.yml
          git add package.json package-lock.json
          git commit -m "chore: finalize Bright Studio v1.2.0"
          git push origin HEAD:main

      - name: Publish GitHub release
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists."
            exit 1
          fi
          TARGET_SHA=$(git rev-parse HEAD)
          cat > release-notes.md <<'EOF'
          ## Bright Studio v1.2.0

          ### 주요 변경
          - Tistory 애드센스 승인용 콘텐츠 모드와 Project 설정 추가
          - 원고 품질, 승인 정책, 공식 출처, 중복, 내부 링크, 사이트 준비 상태의 결정적 승인 준비 검사 추가
          - 공식 출처별 사실 일치 검증과 NGA Open Data 대체 경로 추가
          - 같은 Revision의 승인 준비 결과 재사용 및 수동 재검사 1회 동작 추가
          - 개인정보처리방침은 필수, 사이트 소개·문의는 권장 항목으로 분리
          - 승인 준비 상태를 내부 기준으로만 표시하고 Google AdSense 승인 보장은 하지 않도록 정책 고정

          ### 검증
          - TypeScript typecheck 통과
          - ESLint 통과
          - Vitest 171개 파일, 881개 테스트 통과
          - 수동 테스트 7개 파일, 17개 테스트는 명시적으로 제외
          - Next.js production build 통과
          - 실제 브라우저에서 원고 품질 100, 공식 출처 1개 검증, 사이트 필수 검사 통과 확인
          - 승인 준비 수동 재검사 요청이 정확히 1회 HTTP 200으로 실행되는 것을 확인
          - 실제 Tistory 예약발행 완료
          EOF
          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "Bright Studio v1.2.0" \
            --notes-file release-notes.md

          replace_once("app/user-flow/ContentDocumentEditor.tsx", 'const document = useMemo(() => new ContentNormalizer().normalize(inputDocument), [inputDocument]);', 'const document = useMemo(() => ensureFreeBodyVisuals(new ContentNormalizer().normalize(inputDocument)), [inputDocument]);')
          replace_once("app/api/studio/route.ts", 'import { isPlatformEnabled, resolveWorkspaceSettings } from "../../application/settings/WorkspaceSettingsService";', 'import { isPlatformEnabled, resolveWorkspaceSettings } from "../../application/settings/WorkspaceSettingsService";\nimport { ensureFreeBodyVisuals } from "../../../core/media";')
          replace_once("app/api/studio/route.ts", '  const tags = deriveContentTags(aligned.document, content.primaryKeyword);\n  const qualityTarget = content.qualityTarget ?? content.opportunity?.qualityTarget ?? aligned.document.metadata?.qualityTarget;\n  const baseMetadata = aligned.document.metadata ?? content.document?.metadata;\n  return {\n    ...aligned.document,', '  const visualized = ensureFreeBodyVisuals(aligned.document);\n  const tags = deriveContentTags(visualized, content.primaryKeyword);\n  const qualityTarget = content.qualityTarget ?? content.opportunity?.qualityTarget ?? visualized.metadata?.qualityTarget;\n  const baseMetadata = visualized.metadata ?? content.document?.metadata;\n  return {\n    ...visualized,')
          replace_once("app/api/studio/route.ts", '      longFormStructure: aligned.document.metadata?.longFormStructure ?? content.document?.metadata?.longFormStructure,', '      longFormStructure: visualized.metadata?.longFormStructure ?? content.document?.metadata?.longFormStructure,')
          replace_once("apps/tistory/publishing/TistoryHtmlRenderer.ts", 'import { ContentNormalizer, createContentOutline, type ContentDocument, type ContentOutlineEntry, type TableBlock } from "../../../core/content";', 'import { ContentNormalizer, createContentOutline, type ContentDocument, type ContentOutlineEntry, type TableBlock } from "../../../core/content";\nimport { ensureFreeBodyVisuals, renderBrightBodyVisualHtml } from "../../../core/media";')
          replace_once("apps/tistory/publishing/TistoryHtmlRenderer.ts", '    const document = new ContentNormalizer().normalize(input);', '    const document = ensureFreeBodyVisuals(new ContentNormalizer().normalize(input));')
          replace_once("apps/tistory/publishing/TistoryHtmlRenderer.ts", '       if (block.type === "image") return [...before, block.source ? `<figure><img src="${attribute(block.source)}" alt="${attribute(block.alt)}">${block.caption ? `<figcaption>${escape(block.caption)}</figcaption>` : ""}</figure>` : `<figure class="bright-image-placeholder" data-image-required="true"><strong>추천 이미지</strong><p>${escape(block.alt)}</p></figure>`];', '       if (block.type === "image") return [...before, block.source ? `<figure><img src="${attribute(block.source)}" alt="${attribute(block.alt)}">${block.caption ? `<figcaption>${escape(block.caption)}</figcaption>` : ""}</figure>` : block.purpose !== "hero" && block.purpose !== "inline" ? renderBrightBodyVisualHtml(block) : `<figure class="bright-image-placeholder" data-image-required="true"><strong>추천 이미지</strong><p>${escape(block.alt)}</p></figure>`];')
          replace_once("apps/wordpress/WordPressHtmlRenderer.ts", 'import { ContentNormalizer, type ContentDocument, type TableBlock } from "../../core/content";', 'import { ContentNormalizer, type ContentDocument, type TableBlock } from "../../core/content";\nimport { ensureFreeBodyVisuals, renderBrightBodyVisualHtml } from "../../core/media";')
          replace_once("apps/wordpress/WordPressHtmlRenderer.ts", '    const document = new ContentNormalizer().normalize(input);', '    const document = ensureFreeBodyVisuals(new ContentNormalizer().normalize(input));')
          replace_once("apps/wordpress/WordPressHtmlRenderer.ts", '       if (block.type === "image") return block.source ? `<figure class="wp-block-image"><img src="${attribute(block.source)}" alt="${attribute(block.alt)}"></figure>` : `<!-- image: ${escapeHtml(block.alt)} -->`;', '       if (block.type === "image") return block.source ? `<figure class="wp-block-image"><img src="${attribute(block.source)}" alt="${attribute(block.alt)}"></figure>` : block.purpose !== "hero" && block.purpose !== "inline" ? renderBrightBodyVisualHtml(block) : `<!-- image: ${escapeHtml(block.alt)} -->`;')
          replace_once("app/user-flow/ImageBlockEditor.tsx", 'import type { ImageGenerationQuality, ImageGenerationSize, MediaAsset, ProjectMediaAsset } from "../../core/media";', 'import { brightBodyVisualContent, type ImageGenerationQuality, type ImageGenerationSize, type MediaAsset, type ProjectMediaAsset } from "../../core/media";')
          replace_once("app/user-flow/ImageBlockEditor.tsx", '    {block.source ? <div className="mt-4 overflow-hidden rounded-xl border bg-white"><img alt={alt || "콘텐츠 이미지 미리보기"} className="max-h-[460px] w-full object-contain" src={block.source} /></div> : null}', '    {block.source ? <div className="mt-4 overflow-hidden rounded-xl border bg-white"><img alt={alt || "콘텐츠 이미지 미리보기"} className="max-h-[460px] w-full object-contain" src={block.source} /></div> : null}\n    {!block.source && !isHero && purpose !== "inline" ? <BrightBodyVisualPreview block={{ ...block, alt, purpose }} /> : null}')
          replace_once("app/user-flow/ImageBlockEditor.tsx", ': "본문 이미지는 비용 없는 Project 이미지 재사용 또는 파일 업로드를 사용합니다."}</p>', ': "본문에는 원고 내용으로 만든 무료 Bright 시각 카드가 자동 표시되며, 필요하면 Project 이미지나 파일 업로드로 교체할 수 있습니다."}</p>')


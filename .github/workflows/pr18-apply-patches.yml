name: PR18 Apply Patches
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/content-delete-title'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: node scripts/apply-content-delete-title-route.mjs
      - run: node scripts/apply-editor-title-status.mjs
      - run: node scripts/apply-editor-danger-zone.mjs
      - run: node scripts/apply-content-delete-title-followup.mjs
      - name: Commit exact patches
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/api/studio/route.ts app/user-flow/EditorWorkspace.tsx
          git commit -m "fix: enforce content titles and expose safe deletion"
          git push origin HEAD:${{ github.head_ref }}

name: Finalize content editor re-entry fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply preserved local changes
        run: python .github/scripts/apply_preserved_local_changes.py

      - name: Apply editor re-entry fix
        run: python .github/scripts/fix_content_reentry.py

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused regression test
        run: npx vitest run tests/unit/app/user-flow/ContentNavigation.test.ts

      - name: Run unit tests
        run: npx vitest run tests/unit

      - name: Run integration tests
        run: npx vitest run tests/integration

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-content-editor-reentry.yml
          rm -f .github/workflows/fix-content-editor-reentry-pr.yml
          rm -f .github/workflows/diagnose-content-reentry-tests.yml
          rm -f .github/workflows/finalize-content-editor-reentry.yml
          rm -f .github/scripts/fix_content_reentry.py
          rm -f .github/scripts/apply_preserved_local_changes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/studio/route.ts app/user-flow/ContentCreationFlow.tsx app/user-flow/FirstRunExperience.tsx app/user-flow/content-navigation.ts tests/unit/app/api/StudioGenerationKeywordGuard.test.ts tests/unit/app/user-flow/ContentNavigation.test.ts .github/workflows .github/scripts
          git commit -m "fix: restore editor access for generated drafts"
          git push origin HEAD:${{ github.head_ref }}

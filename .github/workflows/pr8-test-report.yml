name: PR8 Test Report
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run --reporter=json --outputFile=full-test-result.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr8-full-test-result
          path: full-test-result.json

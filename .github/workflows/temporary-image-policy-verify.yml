name: Temporary Image Policy Verify

on:
  push:
    branches:
      - fix/canonical-table-and-image-cost-policy
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-table-and-image-cost-policy

      - name: Restrict free cards to explicit Bright purposes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            "apps/tistory/publishing/TistoryHtmlRenderer.ts": [
              (
                'import { ensureFreeBodyVisuals, renderBrightBodyVisualHtml } from "../../../core/media";',
                'import { ensureFreeBodyVisuals, isFreeBodyVisualBlock, renderBrightBodyVisualHtml } from "../../../core/media";',
              ),
              (
                '        if (block.purpose !== "hero" && block.purpose !== "inline") return [...before, renderBrightBodyVisualHtml(block)];',
                '        if (isFreeBodyVisualBlock(block)) return [...before, renderBrightBodyVisualHtml(block)];',
              ),
            ],
            "apps/wordpress/WordPressHtmlRenderer.ts": [
              (
                'import { ensureFreeBodyVisuals, renderBrightBodyVisualHtml } from "../../core/media";',
                'import { ensureFreeBodyVisuals, isFreeBodyVisualBlock, renderBrightBodyVisualHtml } from "../../core/media";',
              ),
              (
                '        if (block.purpose !== "hero" && block.purpose !== "inline") return renderBrightBodyVisualHtml(block);',
                '        if (isFreeBodyVisualBlock(block)) return renderBrightBodyVisualHtml(block);',
              ),
            ],
            "app/user-flow/ContentDocumentEditor.tsx": [
              (
                'import { brightBodyVisualContent, ensureFreeBodyVisuals } from "../../core/media";',
                'import { brightBodyVisualContent, ensureFreeBodyVisuals, isFreeBodyVisualBlock } from "../../core/media";',
              ),
              (
                '{block.type === "image" ? block.source || block.purpose === "hero" || block.purpose === "inline"',
                '{block.type === "image" ? block.source || !isFreeBodyVisualBlock(block)',
              ),
              (
                'function blockLabel(block: ContentBlock) { if (block.type === "heading") return `H${block.level}`; if (block.type === "paragraph") return "문단"; if (block.type === "table") return "표"; if (block.type === "image") return block.source ? "이미지" : block.purpose !== "hero" && block.purpose !== "inline" ? "무료 시각 카드" : "추천 이미지"; if (block.type === "button") return purposeLabel(block.purpose ?? "cta"); return "비디오"; }',
                'function blockLabel(block: ContentBlock) { if (block.type === "heading") return `H${block.level}`; if (block.type === "paragraph") return "문단"; if (block.type === "table") return "표"; if (block.type === "image") return block.source ? "이미지" : isFreeBodyVisualBlock(block) ? "무료 시각 카드" : "추천 이미지"; if (block.type === "button") return purposeLabel(block.purpose ?? "cta"); return "비디오"; }',
              ),
            ],
          }

          changed = False
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding="utf-8-sig")
              for old, new in pairs:
                  if new in text:
                      continue
                  if old not in text:
                      raise SystemExit(f"Expected patch target missing in {file_name}: {old}")
                  text = text.replace(old, new, 1)
                  changed = True
              path.write_text(text, encoding="utf-8")

          if not changed:
              print("Explicit free visual policy already applied.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add app/user-flow/ContentDocumentEditor.tsx apps/tistory/publishing/TistoryHtmlRenderer.ts apps/wordpress/WordPressHtmlRenderer.ts
            git commit -m "fix: preserve generic image placeholders"
            git push origin HEAD:fix/canonical-table-and-image-cost-policy
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test and build
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          test_status=${PIPESTATUS[0]}
          npm run build 2>&1 | tee build.log
          build_status=${PIPESTATUS[0]}
          echo "Verification results: tests=$test_status build=$build_status"
          if [[ "$test_status" != "0" || "$build_status" != "0" ]]; then
            exit 1
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-body-visual-verification-logs
          path: |
            test.log
            build.log
          if-no-files-found: warn
          retention-days: 1

name: Verify and finish editor quality fix

on:
  push:
    branches: [fix/editor-html-review-structure]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editor-html-review-structure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply remaining reviewed changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def load(path): return Path(path).read_text(encoding='utf-8-sig')
          def save(path, text): Path(path).write_text(text, encoding='utf-8')
          def replace(path, old, new):
              text = load(path)
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one exact match, got {text.count(old)}')
              save(path, text.replace(old, new, 1))
          def sub(path, pattern, replacement):
              text = load(path)
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, got {count}')
              save(path, result)

          q = 'core/quality/QualityEngine.ts'
          replace(q, '  contentIntentTerms,\n', '')
          replace(q,
              '  const practicalToolSignals = matches(text, /(?:체크리스트|기록표|예시|순서|단계|먼저|다음으로|마지막으로|한눈에|표로 정리|행동 흐름)/g);\n',
              '  const structuralToolSignals = contentDiagnostic.sections.reduce((sum, section) => sum + section.listItemCount + section.tableCount, 0);\n  const practicalToolSignals = structuralToolSignals + matches(text, /(?:체크리스트|기록표|예시|순서|단계|먼저|다음으로|마지막으로|한눈에|표로 정리|행동 흐름)/g);\n')
          replace(q,
              '  const repeatedCoreAdviceCount = countRepeatedCoreAdvice(paragraphs.map((item) => item.text));\n',
              '  const repeatedCoreAdviceCount = contentDiagnostic.repetitionWarnings.length;\n')
          replace(q,
              'editorialInstructionCount, practicalToolSignals, vagueInstructionCount, concreteCriteriaCount, semanticHeadingOverlapCount, repeatedCoreAdviceCount };',
              'editorialInstructionCount, structuralToolSignals, practicalToolSignals, vagueInstructionCount, concreteCriteriaCount, semanticHeadingOverlapCount, repeatedCoreAdviceCount };')
          sub(q,
              r'  const intentTerms = contentIntentTerms\(s\.context\.searchIntent \?\? ""\);.*?  const searchIntentScore = searchIntentFulfilled \? Math\.max\(measuredSearchIntentScore, s\.opportunityAlignment \? 95 : 0\) : 0;',
              '''  const intentMetadata = Boolean(s.document.metadata?.primarySearchIntent?.trim());
  const intentSignal = s.opportunityAlignment?.review.searchIntentFulfillment;
  const searchIntentFulfilled = intentSignal?.pass ?? Boolean(s.context.searchIntent && intro.length > 0 && requiredMissing === 0);
  const measuredSearchIntentScore = !s.context.searchIntent
    ? 0
    : intentSignal
      ? intentSignal.score
      : intentMetadata && intro.length > 0 && conclusion.length > 0 && requiredMissing === 0
        ? 95
        : intro.length > 0 ? 80 : 60;
  const searchIntentScore = measuredSearchIntentScore;
  const singleSentenceThreshold = Math.max(2, Math.floor(s.paragraphs.length * 0.4));
  const singleSentenceExcess = Math.max(0, s.singleSentenceParagraphs - singleSentenceThreshold);''')
          replace(q,
              '[{ signal: "confirmedSearchIntent", value: s.context.searchIntent ?? false }, { signal: "reflectedIntentTerms", value: reflectedIntentTerms }, { signal: "intentMetadata", value: intentMetadata }, { signal: "searchIntentFulfilled", value: s.opportunityAlignment?.review.searchIntentFulfillment.pass ?? "not_evaluated" }, { signal: "contentOpportunityConsistent", value: s.opportunityAlignment?.review.pass ?? "not_evaluated" }],',
              '[{ signal: "confirmedSearchIntent", value: s.context.searchIntent ?? false }, { signal: "intentFulfillmentScore", value: intentSignal?.score ?? measuredSearchIntentScore }, { signal: "intentMetadata", value: intentMetadata }, { signal: "searchIntentFulfilled", value: intentSignal?.pass ?? "not_evaluated" }, { signal: "contentOpportunityConsistent", value: s.opportunityAlignment?.review.contentOpportunityConsistency.pass ?? "not_evaluated" }],')
          sub(q,
              r'    dimension\("readability", clamp\(100 - Math\.min\(24, s\.excessiveSentenceParagraphs \* 8\) - Math\.min\(18, s\.singleSentenceParagraphs \* 2\) - Math\.min\(15, s\.repeatedOpenings \* 5\) - Math\.min\(20, s\.clicheCount \* 4\)\),\n      .*?\),\n    dimension\("structure"',
              '''    dimension("readability", clamp(100 - Math.min(24, s.excessiveSentenceParagraphs * 8) - Math.min(18, singleSentenceExcess * 3) - Math.min(15, s.repeatedOpenings * 5) - Math.min(20, s.clicheCount * 4)),
      [...(s.excessiveSentenceParagraphs ? ["한 문단에 너무 많은 문장이 이어져 읽기 어렵습니다."] : []), ...(singleSentenceExcess ? ["한 문장 문단이 반복되어 흐름이 끊깁니다."] : []), ...(s.clicheCount ? ["상투적인 AI 표현이 반복됩니다."] : [])], ["문단마다 하나의 논점을 명확히 설명하고 반복되는 도입 표현을 제거하세요."], [{ signal: "paragraphCount", value: s.metrics.paragraphCount }, { signal: "singleSentenceParagraphs", value: s.singleSentenceParagraphs }, { signal: "singleSentenceThreshold", value: singleSentenceThreshold }, { signal: "singleSentenceExcess", value: singleSentenceExcess }, { signal: "excessiveSentenceParagraphs", value: s.excessiveSentenceParagraphs }, { signal: "repeatedOpenings", value: s.repeatedOpenings }, { signal: "clicheCount", value: s.clicheCount }]),
    dimension("structure"''')
          sub(q, r'function countRepeatedCoreAdvice\(paragraphs: readonly string\[\]\): number \{.*?\n\}\n', '')

          g = 'app/application/EditorialGenerationStrategy.ts'
          replace(g, '  analyzeLongFormDocument,\n', '  analyzeLongFormDocument,\n  ContentNormalizer,\n')
          replace(g, '    const finalized = ensureDistinctImagePrompts(document, input.keywords[0]);\n', '    const normalized = new ContentNormalizer().normalize(document);\n    const finalized = ensureDistinctImagePrompts(normalized, input.keywords[0]);\n')
          replace(g, 'Return JSON only in this exact generation shape:', 'Paragraph values must be plain text. When a list is needed, use newline-prefixed `1.` or `-` items inside the paragraph string; never return HTML tags such as `<ol>`, `<ul>`, `<li>`, or `<p>`. Return JSON only in this exact generation shape:')

          p = 'app/application/EditorialQualityPipeline.ts'
          replace(p,
              'import { contentRevisionId, QualityEngine, type QualityReviewContext } from "../../core/quality";\n',
              'import { contentRevisionId, evaluateQualityReviewReadiness, QualityEngine, type QualityReviewContext } from "../../core/quality";\n')
          sub(p,
              r'      const parsed = preserveReviewMetadata\(current, restoreVerifiedEditorialLinks\(.*?      return \{ document, quality: this\.qualityEngine\.review\(document, \{ \.\.\.qualityContext, revisionId: contentRevisionId\(document\) \}\) \};',
              '''      const parsed = preserveReviewMetadata(current, restoreVerifiedEditorialLinks(
        current,
        restoreProtectedImageAssets(current, this.strategy.parse(response, parseInput)),
      ));
      const parsedQuality = this.qualityEngine.review(parsed, { ...qualityContext, revisionId: contentRevisionId(parsed) });
      const parsedDiagnostic = analyzeLongFormDocument(parsed, parseInput.contentOpportunity?.qualityTarget ?? parsed.metadata?.qualityTarget);
      const readiness = evaluateQualityReviewReadiness(parsed, parsedQuality, parsedDiagnostic);
      const linkError = verifiedLinkError(current, parsed);
      const safetyError = manuscriptSafetyError(current, parsed);
      const shapeError = editorialShapeError(parsed, parseInput) ?? (readiness.fatal ? readiness.fatalReasons[0] : undefined);
      if (linkError || safetyError || shapeError) {
        return { document: parsed, quality: parsedQuality, rejectionReason: linkError ?? safetyError ?? shapeError };
      }
      const document = await place(parsed);
      const quality = this.qualityEngine.review(document, { ...qualityContext, revisionId: contentRevisionId(document) });
      const placedDiagnostic = analyzeLongFormDocument(document, parseInput.contentOpportunity?.qualityTarget ?? document.metadata?.qualityTarget);
      const placedReadiness = evaluateQualityReviewReadiness(document, quality, placedDiagnostic);
      return placedReadiness.fatal
        ? { document, quality, rejectionReason: placedReadiness.fatalReasons[0] }
        : { document, quality };''')
          sub(p,
              r'function editorialShapeError\(document: ContentDocument, parseInput: ParseInput\): string \| undefined \{.*?\n\}',
              '''function editorialShapeError(document: ContentDocument, parseInput: ParseInput): string | undefined {
  if (!/tistory|blog|article|long-form|장문|guide/i.test(`${parseInput.platform} ${parseInput.contentType}`)) return undefined;
  const paragraphs = document.blocks.filter((block) => block.type === "paragraph" && block.text.trim());
  const h2 = document.blocks.filter((block) => block.type === "heading" && block.level === 2).length;
  return paragraphs.length === 0 || h2 === 0 ? "editorial_shape_incomplete" : undefined;
}''')
          replace(p,
              'This is the second and final AI call. Make only targeted editorial corrections to the current canonical document. Do not broadly rewrite strong sections or expand the manuscript into a new long-form draft. Return the complete publish-ready canonical ContentDocument in this one response. Do not return a review, plan, score, explanation, or partial patch.\n',
              'This is the second and final AI call. Make only targeted editorial corrections to the current canonical document. Do not broadly rewrite strong sections or expand the manuscript into a new long-form draft. Return the complete publish-ready canonical ContentDocument in this one response. Do not return a review, plan, score, explanation, or partial patch. Every paragraph.text must be plain text; represent ordered or unordered lists with newline-prefixed `1.` or `-` items and never return HTML list or paragraph tags.\n')
          PY
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit verified changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-editor-quality-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: align editor quality evaluation" || exit 0
          git push origin HEAD:fix/editor-html-review-structure

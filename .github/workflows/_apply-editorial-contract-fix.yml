name: apply editorial contract fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply audited contract patch
        shell: bash
        run: |
          set -euo pipefail
          git apply Docs/patches/2026-08-18-adsense-editorial-contract-fix.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/application/EditorialGenerationStrategy.ts')
          s = p.read_text()
          old = '''function ensureEditorialPlacement(blocks: ContentDocument["blocks"]): ContentDocument["blocks"] {
  return blocks;
}'''
          new = '''function ensureEditorialPlacement(blocks: ContentDocument["blocks"]): ContentDocument["blocks"] {
  const sourceBlocks: ContentDocument["blocks"] = [];
  const editorialBlocks: ContentDocument["blocks"] = [];
  const systemBlocks: ContentDocument["blocks"] = [];
  let sourceStart = -1;
  for (const block of blocks) {
    if (block.type === "heading" && block.text.trim().replace(/\\s+/g, " ") === "출처") {
      sourceStart = systemBlocks.length;
      sourceBlocks.push(block);
      continue;
    }
    if (sourceStart >= 0) {
      if (block.type === "heading" && block.level <= 2) {
        sourceStart = -1;
      } else {
        sourceBlocks.push(block);
        continue;
      }
    }
    if (block.type === "heading" && block.text.trim().replace(/\\s+/g, " ") === "정보 기준과 다시 확인할 곳") {
      systemBlocks.push(block);
      continue;
    }
    editorialBlocks.push(block);
  }
  const trailingSystem = blocks.filter((block) =>
    block.type === "heading" && block.text.trim().replace(/\\s+/g, " ") === "정보 기준과 다시 확인할 곳",
  );
  const deduped = editorialBlocks.filter((block) =>
    !(block.type === "heading" && block.text.trim().replace(/\\s+/g, " ") === "정보 기준과 다시 확인할 곳"),
  );
  return Object.freeze([
    ...deduped,
    ...systemBlocks.filter((block) => block.type !== "heading"),
    ...trailingSystem,
    ...sourceBlocks,
  ]);
}'''
          if old not in s:
              raise SystemExit('ensureEditorialPlacement target not found')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('app/application/ContentPlanningStrategyBase.ts')
          s = p.read_text()
          marker = '''function createPlanningVerificationPlan(raw: unknown) {'''
          insert = '''function ensureOpportunityCandidateDiversity(
  candidates: readonly ContentOpportunityCandidate[],
): readonly ContentOpportunityCandidate[] {
  if (candidates.length < 2) return candidates;
  const seen = new Set<string>();
  const diverse: ContentOpportunityCandidate[] = [];
  for (const candidate of candidates) {
    const shape = [
      candidate.contentType.trim().toLowerCase(),
      candidate.qualityTarget?.contentDepth ?? "",
      candidate.searchIntent.trim().toLowerCase(),
    ].join("|");
    if (seen.has(shape)) continue;
    seen.add(shape);
    diverse.push(candidate);
  }
  if (diverse.length < 2) {
    throw new Error("AI planning response did not provide materially diverse opportunity candidates.");
  }
  return Object.freeze(diverse);
}

'''
          if marker not in s:
              raise SystemExit('planning marker not found')
          s = s.replace(marker, insert + marker, 1)
          old = '''  }));
}

function createPlanningVerificationPlan(raw: unknown) {'''
          new = '''  }));
  return ensureOpportunityCandidateDiversity(candidates);
}

function createPlanningVerificationPlan(raw: unknown) {'''
          if old not in s:
              raise SystemExit('planning return target not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/_apply-editorial-contract-fix.yml
      - name: Validate changed TypeScript
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test -- --runInBand
      - name: Commit audited code changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/application/ContentPlanningStrategyBase.ts app/application/EditorialGenerationStrategy.ts core/ai/AIWorkflow.ts core/content/ContentOpportunityAlignment.ts app/application/publishing/WordPressDraftReadiness.ts .github/workflows/_apply-editorial-contract-fix.yml
          git diff --cached --check
          git commit -m 'fix: enforce official source editorial contracts'
          git push origin HEAD:fix/editorial-contract-20260818

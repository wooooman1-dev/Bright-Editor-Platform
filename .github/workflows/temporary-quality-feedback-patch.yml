name: Temporary Quality Feedback Patch

on:
  push:
    branches:
      - fix/quality-improvement-feedback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/quality-improvement-feedback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/apply-quality-feedback-fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/studio/route.ts app/user-flow/EditorWorkspace.tsx app/user-flow/QualityImprovementPreview.tsx app/globals.css tests/unit/app/user-flow/QualityImprovementPreview.test.tsx
          git commit -m "fix: show quality improvement progress and results"
          git push origin HEAD:fix/quality-improvement-feedback

name: Diagnose content re-entry tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/fix_content_reentry.py
      - run: npm ci
      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          echo "$status" > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: content-reentry-test-diagnostics
          path: |
            test-output.log
            test-exit-code.txt

name: Bright Studio full audit fix

on:
  push:
    branches:
      - fix/wordpress-full-audit
    paths:
      - ".github/workflows/bright-full-audit-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out protected fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/wordpress-full-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: dependencies
        continue-on-error: true
        run: npm ci

      - name: Assemble and validate correction script
        id: assemble
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        run: |
          cat .bright-audit/parts/part-*.b64 | base64 --decode > /tmp/bright-full-audit-fix.mjs
          node --check /tmp/bright-full-audit-fix.mjs

      - name: Apply correction bundle
        id: apply
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        run: node /tmp/bright-full-audit-fix.mjs

      - name: Verify protected generated file is unchanged
        id: protected_file
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: git diff --exit-code -- next-env.d.ts

      - name: Typecheck
        id: typecheck
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Test
        id: test
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Build
        id: build
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Diff check
        id: diff_check
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Record result and commit only verified code
        if: always()
        env:
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          ASSEMBLE: ${{ steps.assemble.outcome }}
          APPLY: ${{ steps.apply.outcome }}
          PROTECTED_FILE: ${{ steps.protected_file.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DIFF_CHECK: ${{ steps.diff_check.outcome }}
        run: |
          SUCCESS=false
          if [ "$DEPENDENCIES" = success ] && \
             [ "$ASSEMBLE" = success ] && \
             [ "$APPLY" = success ] && \
             [ "$PROTECTED_FILE" = success ] && \
             [ "$TYPECHECK" = success ] && \
             [ "$LINT" = success ] && \
             [ "$TEST" = success ] && \
             [ "$BUILD" = success ] && \
             [ "$DIFF_CHECK" = success ]; then
            SUCCESS=true
          fi

          cat > .bright-audit-result.md <<REPORT
          # Bright Studio full audit correction result

          - source branch: fix/wordpress-full-audit
          - workflow commit: ${GITHUB_SHA}
          - success: ${SUCCESS}
          - dependencies: ${DEPENDENCIES}
          - script assembly: ${ASSEMBLE}
          - correction apply: ${APPLY}
          - next-env.d.ts unchanged: ${PROTECTED_FILE}
          - typecheck: ${TYPECHECK}
          - lint: ${LINT}
          - test: ${TEST}
          - build: ${BUILD}
          - diff check: ${DIFF_CHECK}
          - run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          REPORT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$SUCCESS" = true ]; then
            rm -rf .bright-audit .github/workflows/bright-full-audit-fix.yml
            git add -A
            git commit -m "fix: align evidence preview metrics and draft gates"
          else
            git add .bright-audit-result.md
            git commit -m "chore: record failed full audit verification"
          fi
          git push origin HEAD:fix/wordpress-full-audit

name: Bright Studio full audit fix

on:
  push:
    branches:
      - fix/wordpress-full-audit
    paths:
      - ".github/workflows/bright-full-audit-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out protected fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/wordpress-full-audit

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assemble and validate correction script
        run: |
          cat .bright-audit/parts/part-*.b64 | base64 --decode > /tmp/bright-full-audit-fix.mjs
          node --check /tmp/bright-full-audit-fix.mjs

      - name: Apply correction bundle
        run: node /tmp/bright-full-audit-fix.mjs

      - name: Verify protected generated file is unchanged
        run: git diff --exit-code -- next-env.d.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Remove one-time workflow files
        run: rm -rf .bright-audit .github/workflows/bright-full-audit-fix.yml

      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: align evidence preview metrics and draft gates"
          git push origin HEAD:fix/wordpress-full-audit

name: Temporary PR Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout quietly
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${MERGE_SHA}"
          git checkout -q FETCH_HEAD

      - name: Runtime
        run: node --version

      - name: Install dependencies
        run: npm ci --silent

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=dot

      - name: Build
        if: always()
        run: npm run build

      - name: Diff check
        if: always()
        run: git diff --check

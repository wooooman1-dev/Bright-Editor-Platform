name: Temporary PR Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout quietly
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "${MERGE_SHA}"
          git checkout -q FETCH_HEAD

      - name: Runtime
        run: node --version

      - name: Install dependencies
        run: npm ci --silent

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=vitest-results.json >/dev/null 2>&1
          status=$?
          node <<'NODE'
          const fs = require('node:fs');
          if (!fs.existsSync('vitest-results.json')) {
            console.log('Vitest did not produce a JSON result file.');
            process.exit(0);
          }
          const result = JSON.parse(fs.readFileSync('vitest-results.json', 'utf8'));
          console.log(`Test summary: ${result.numPassedTests ?? 0} passed, ${result.numFailedTests ?? 0} failed, ${result.numPendingTests ?? 0} skipped.`);
          for (const file of result.testResults ?? []) {
            const failed = (file.assertionResults ?? []).filter((test) => test.status === 'failed');
            if (!failed.length && file.status !== 'failed') continue;
            console.log(`FAILED FILE: ${file.name ?? 'unknown'}`);
            for (const test of failed) {
              console.log(`FAILED TEST: ${test.fullName ?? test.title ?? 'unknown'}`);
              for (const message of test.failureMessages ?? []) console.log(String(message).split('\n').slice(0, 12).join('\n'));
            }
            for (const message of file.message ? [file.message] : []) console.log(String(message).split('\n').slice(0, 12).join('\n'));
          }
          NODE
          exit $status

      - name: Build
        if: always()
        run: npm run build

      - name: Diff check
        if: always()
        run: git diff --check

name: Targeted Quality Feedback Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  route-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - id: route_test
        continue-on-error: true
        run: npx vitest run tests/unit/app/api/QualityImprovementCandidateRoute.test.ts --reporter=json --outputFile=route-test-result.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-test-result
          path: route-test-result.json
      - if: steps.route_test.outcome == 'failure'
        run: exit 1

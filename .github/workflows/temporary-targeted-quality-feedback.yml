name: Targeted Quality Feedback Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run tests/unit/app/api/QualityImprovementCandidateRoute.test.ts tests/unit/app/user-flow/OperationProgressStyle.test.ts tests/unit/app/user-flow/QualityImprovementPreview.test.tsx --reporter=verbose

name: PR16 Targeted
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  content-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run tests/unit/core/content/ContentTags.test.ts --reporter=verbose
  seo-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run tests/unit/core/content/SeoKeywordPlacement.test.ts tests/unit/core/quality/QualityTitleReadability.test.ts --reporter=verbose
  tistory-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run tests/unit/apps/tistory/TistoryTags.test.ts --reporter=verbose

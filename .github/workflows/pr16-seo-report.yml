name: PR16 SEO Report
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx vitest run tests/unit/core/content/SeoKeywordPlacement.test.ts tests/unit/core/quality/QualityTitleReadability.test.ts --reporter=json --outputFile=seo-test-report.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: pr16-seo-test-report
          path: seo-test-report.json

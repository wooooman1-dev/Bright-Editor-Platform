name: Verify content editor re-entry fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply focused restoration fix
        run: python .github/scripts/fix_content_reentry.py

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression test
        run: npx vitest run tests/unit/app/user-flow/ContentNavigation.test.ts

      - name: Run full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/fix-content-editor-reentry.yml
          rm .github/workflows/fix-content-editor-reentry-pr.yml
          rm .github/scripts/fix_content_reentry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/user-flow/FirstRunExperience.tsx app/user-flow/content-navigation.ts tests/unit/app/user-flow/ContentNavigation.test.ts .github/workflows .github/scripts
          git commit -m "fix: restore editor access for generated drafts"
          git push origin HEAD:${{ github.head_ref }}

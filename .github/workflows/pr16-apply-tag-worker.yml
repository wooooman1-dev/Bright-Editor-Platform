name: PR16 Apply Tag Worker
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.head_ref == 'fix/tistory-tags-and-title-quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: node scripts/apply-tistory-tag-workflow.mjs
      - name: Commit exact worker integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/tistory/workflows/tistory-draft-worker.mjs
          git commit -m "feat: integrate verified Tistory tags"
          git push origin HEAD:${{ github.head_ref }}

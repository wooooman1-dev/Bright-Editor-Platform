name: Temporary Quality Preview Patch

on:
  push:
    branches:
      - fix/quality-improvement-preview-and-confirmation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/quality-improvement-preview-and-confirmation
          fetch-depth: 0

      - name: Apply focused patch
        run: python .github/scripts/apply-quality-preview-patch.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/user-flow/EditorWorkspace.tsx app/api/studio/route.ts tests/unit/app/user-flow/UsableContentFlow.test.tsx
          git commit -m "fix: clarify quality approval and final confirmation"
          git push origin HEAD:fix/quality-improvement-preview-and-confirmation

name: Temp Operation SEO Artifact
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/apply-operation-seo-fix.py
      - uses: actions/upload-artifact@v4
        with:
          name: operation-seo-patched-files
          path: |
            app/api/studio/route.ts
            app/user-flow/EditorWorkspace.tsx

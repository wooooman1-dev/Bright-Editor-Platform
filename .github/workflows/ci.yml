name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: lint
        name: Lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee ci-lint.log

      - id: typecheck
        name: Typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee ci-typecheck.log

      - id: tests
        name: Unit tests
        continue-on-error: true
        run: npm test 2>&1 | tee ci-tests.log

      - id: build
        name: Production build
        continue-on-error: true
        run: npm run build 2>&1 | tee ci-build.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ci-*.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail when verification failed
        if: always() && (steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.build.outcome == 'failure')
        run: exit 1

name: Temporary Branch Verify

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - fix/canonical-table-and-image-cost-policy

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-branch-verification-logs
          path: |
            test.log
            build.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail when verification fails
        if: always()
        shell: bash
        run: |
          test_status="${{ steps.tests.outputs.status }}"
          build_status="${{ steps.build.outputs.status }}"
          if [[ "$test_status" != "0" || "$build_status" != "0" ]]; then
            echo "Verification failed: tests=$test_status build=$build_status"
            exit 1
          fi

name: Bright Studio v1.1.0 Release

on:
  pull_request:
    branches:
      - main
    types:
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-table-and-image-cost-policy

      - name: Set release version
        shell: bash
        run: |
          npm version 1.1.0 --no-git-tag-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add package.json package-lock.json
            git commit -m "chore: bump version to 1.1.0"
            git push origin HEAD:fix/canonical-table-and-image-cost-policy
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'release: v1.1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: v1.1.0
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove one-time release workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.1.0.yml
          git commit -m "chore: remove v1.1.0 release workflow"
          git push origin HEAD:main

      - name: Publish GitHub release
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists."
            exit 1
          fi
          TARGET_SHA=$(git rev-parse HEAD)
          cat > release-notes.md <<'EOF'
          ## Bright Studio v1.1.0

          ### 주요 변경
          - Markdown·HTML 표를 편집 가능한 canonical TableBlock으로 통합
          - Tistory와 WordPress에서 안전한 반응형 표 렌더링
          - 대표이미지 1장 중심의 비용 최적화 정책
          - 표·체크리스트·요약·주의·인포그래픽 무료 Bright 카드 지원
          - 무료 카드를 사용자가 명시적으로 선택한 경우에만 유료 AI 이미지로 교체
          - 미전송 대표이미지의 안전한 Project 재사용
          - 관련 글 3개 최하단 배치 보장
          - 표와 무료 카드 내용을 포함한 검색 의도·이미지 전략 품질 평가 수정

          ### 검증
          - TypeScript typecheck 통과
          - ESLint 통과
          - 전체 Vitest 테스트 통과
          - Next.js production build 통과
          - 실제 Tistory 예약발행 검증 완료
          EOF
          gh release create "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${TARGET_SHA}" \
            --title "Bright Studio v1.1.0" \
            --notes-file release-notes.md
